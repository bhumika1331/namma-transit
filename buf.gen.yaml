version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bhumika1331/namma-transit/backend/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
