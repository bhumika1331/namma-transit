name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint protos
        run: buf lint
      - name: Check generated code is current
        run: |
          buf generate
          git diff --exit-code -- backend/gen web/src/gen
      - name: Vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API: https://example.invalid
